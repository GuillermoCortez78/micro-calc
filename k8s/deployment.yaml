apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-calc
  namespace: micro-calc
  labels:
    app: micro-calc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: micro-calc
  template:
    metadata:
      labels:
        app: micro-calc
    spec:
      containers:
        - name: micro-calc
          image: guillecortez78/micro-calc:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: micro-calc-config
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
